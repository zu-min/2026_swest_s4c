[tools."http:xpack-riscv-none-elf-gcc"]
version = "13.2.0-2"
url = "https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v{{ version }}/xpack-riscv-none-elf-gcc-{{ version }}-darwin-arm64.tar.gz"
checksum = "sha256:dfe3123e5e5093b165eaaf18401b802cbb8697f5ec9b0f5cfd99c45e848fd8a7"
os = ["macos/arm64"]

[tools]
"conda:libusb" = "1.0.29"

[settings]
lockfile_platforms = ["macos-arm64"]

[tasks.doctor]
description = "ホストとV006開発ツールの実行環境を確認する"
run = """
test "$(uname -m)" = "arm64"
toolchain_dir="$(mise where http:xpack-riscv-none-elf-gcc)"
file "${toolchain_dir}/bin/riscv-none-elf-gcc"
"${toolchain_dir}/bin/riscv-none-elf-gcc" --version
libusb_prefix="$(mise where conda:libusb)"
file "${libusb_prefix}/lib/libusb-1.0.dylib"
otool -L "${libusb_prefix}/lib/libusb-1.0.dylib"
"""

[tasks."ch32fun:checkout"]
description = "公式ch32funを固定リビジョンで取得する"
run = """
set -eu
source_dir=".cache/ch32fun"
repository="https://github.com/cnlohr/ch32fun.git"
revision="6c4dd539a422aaea0ba6ce45630eed1b49728579"

if [ ! -d "$source_dir/.git" ]; then
  git clone --filter=blob:none --no-checkout \
    "$repository" \
    "$source_dir"
fi

git -C "$source_dir" remote set-url origin "$repository"
if [ "$(git -C "$source_dir" rev-parse HEAD)" = "$revision" ]; then
  exit 0
fi

git -C "$source_dir" fetch --depth 1 origin "$revision"
git -C "$source_dir" switch --detach "$revision"
"""

[tasks."minichlink:build"]
description = "arm64 macOS版minichlinkをビルドする"
depends = ["ch32fun:checkout"]
run = """
set -eu
source_dir=".cache/ch32fun"
libusb_prefix="$(mise where conda:libusb)"
make -C "$source_dir/minichlink" minichlink \
  SHASUM="/usr/bin/shasum" \
  LIBUSB_INCS="-I${libusb_prefix}/include/libusb-1.0" \
  LIBUSB_LIBS="-L${libusb_prefix}/lib -lusb-1.0 -Wl,-rpath,${libusb_prefix}/lib"

mkdir -p .build/tools
cp "$source_dir/minichlink/minichlink" .build/tools/minichlink
file .build/tools/minichlink
otool -L .build/tools/minichlink
"""

[tasks."ch32v006:compile-blink"]
description = "UIAPduino Pro Micro CH32V006 V1.1向けにBlinkをコンパイルする"
depends = ["ch32fun:checkout"]
run = """
set -eu
firmware_dir="firmware/ch32v006/blink"
ch32fun_dir="$PWD/.cache/ch32fun/ch32fun"
toolchain_dir="$(mise where http:xpack-riscv-none-elf-gcc)"
compiler_prefix="${toolchain_dir}/bin/riscv-none-elf"

make -C "$firmware_dir" clean CH32FUN="$ch32fun_dir" PREFIX="$compiler_prefix"
make -C "$firmware_dir" build CH32FUN="$ch32fun_dir" PREFIX="$compiler_prefix"
mkdir -p .build/ch32v006/blink
cp "$firmware_dir/blink.bin" .build/ch32v006/blink/blink.bin
cp "$firmware_dir/blink.elf" .build/ch32v006/blink/blink.elf
make -C "$firmware_dir" clean CH32FUN="$ch32fun_dir" PREFIX="$compiler_prefix"
"""

[tasks."ch32v006:probe"]
description = "UIAPduino Pro Micro CH32V006 V1.1のオンボードデバッガを検出する"
depends = ["minichlink:build"]
run = """
.build/tools/minichlink \
  -c 0x1209b806 \
  -C funprog \
  -i
"""

[tasks."ch32v006:flash-blink"]
description = "UIAPduino Pro Micro CH32V006 V1.1へBlinkを書き込む"
depends = ["minichlink:build", "ch32v006:compile-blink"]
run = """
.build/tools/minichlink \
  -c 0x1209b806 \
  -C funprog \
  -w .build/ch32v006/blink/blink.bin \
  flash \
  -b
"""
